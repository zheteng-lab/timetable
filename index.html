<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C1 Booking Manager | Smart Slots</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid #f1f5f9; }
        .card:hover { transform: translateY(-2px); border-color: #e2e8f0; }
        .card-booked { border-color: #4f46e5 !important; background-color: #ffffff; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.1); }
        .toggle-active { background-color: white !important; color: #4f46e5 !important; font-weight: 900 !important; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .status-btn-active { background-color: #1e293b !important; color: white !important; }
        
        .type-trial { background-color: #fef9c3; color: #854d0e; border: 1px solid #facc15; }
        .type-replacement { background-color: #ffedd5; color: #9a3412; border: 1px solid #fb923c; }
        .type-assessment { background-color: #f3e8ff; color: #581c87; border: 1px solid #c084fc; }

        #toast { transition: all 0.4s ease; transform: translateY(100px); opacity: 0; pointer-events: none; }
        #toast.show { transform: translateY(0); opacity: 1; }
        .modal-animate { animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- COUNTER HUD -->
    <div class="fixed bottom-6 left-6 z-[100] flex flex-col gap-2 bg-slate-900 text-white p-4 rounded-[28px] shadow-2xl border border-slate-700/50 min-w-[180px]">
        <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-1">
            <span class="text-[9px] font-black uppercase text-indigo-400">Activity Summary</span>
        </div>
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold text-slate-400">TRIALS</span>
            <span id="countTrial" class="text-xs font-black text-yellow-400">0</span>
        </div>
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold text-slate-400">REPLACEMENTS</span>
            <span id="countReplacement" class="text-xs font-black text-orange-400">0</span>
        </div>
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold text-slate-400">ASSESSMENTS</span>
            <span id="countAssessment" class="text-xs font-black text-purple-400">0</span>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] bg-slate-900 text-white px-8 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-2xl flex items-center gap-3">
        <span id="toastDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="toastMsg">Action Successful</span>
    </div>

    <!-- HEADER NAV -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 h-20 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-black italic text-xl shadow-lg shadow-indigo-200">C1</div>
            <div>
                <h1 class="text-[10px] font-black uppercase text-slate-400 leading-none mb-1">Teacher Availability</h1>
                <div class="flex items-center gap-2">
                    <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-300"></span>
                    <span id="statusText" class="text-xs font-bold text-slate-600 uppercase">Connecting...</span>
                </div>
            </div>
        </div>
        <div class="flex bg-slate-100 p-1.5 rounded-2xl w-80">
            <button onclick="window.setView('list')" id="viewListBtn" class="flex-1 py-2.5 text-xs font-black uppercase transition-all toggle-active">Slots Search</button>
            <button onclick="window.setView('calendar')" id="viewCalendarBtn" class="flex-1 py-2.5 text-xs font-black uppercase transition-all text-slate-400">Weekly View</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        
        <!-- SEARCH FILTERS (LIST VIEW) -->
        <div id="listFilters" class="bg-white rounded-[32px] border border-slate-200 p-8 mb-8 shadow-sm">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Search -->
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Search</label>
                    <input type="text" id="searchInput" oninput="window.render()" placeholder="Name..." class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold outline-none ring-indigo-500 focus:ring-2">
                </div>
                <!-- Teacher -->
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Teacher</label>
                    <select id="teacherFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold outline-none cursor-pointer"></select>
                </div>
                <!-- Subject -->
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Subject</label>
                    <select id="subjectFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold outline-none cursor-pointer"></select>
                </div>
                <!-- Day -->
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Day</label>
                    <select id="dayFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold outline-none cursor-pointer">
                        <option value="ALL">All Days</option>
                        <option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option><option value="Sunday">Sunday</option>
                    </select>
                </div>
                <!-- Time -->
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Time</label>
                    <select id="timeFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold outline-none cursor-pointer"></select>
                </div>
                <!-- Date -->
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Specific Date</label>
                    <input type="date" id="dateFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold outline-none">
                </div>
                <!-- Type -->
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Special Type</label>
                    <select id="typeFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold outline-none cursor-pointer">
                        <option value="ALL">All Special</option>
                        <option value="Trial">Trial</option>
                        <option value="Replacement">Replacement</option>
                        <option value="Assessment">Assessment</option>
                    </select>
                </div>
                <!-- Status Toggle -->
                <div class="space-y-2 flex flex-col justify-start">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">View Only</label>
                    <div class="flex bg-slate-100 p-1 rounded-xl h-12">
                        <button onclick="window.setStatus('all')" id="btnAll" class="flex-1 text-[9px] font-black uppercase rounded-lg status-btn-active">All</button>
                        <button onclick="window.setStatus('open')" id="btnOpen" class="flex-1 text-[9px] font-black uppercase rounded-lg text-slate-400">Free</button>
                        <button onclick="window.setStatus('booked')" id="btnBooked" class="flex-1 text-[9px] font-black uppercase rounded-lg text-slate-400">Full</button>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-end mt-6 pt-6 border-t border-slate-100">
                <button onclick="window.clearFilters()" class="px-8 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 text-[10px] font-black uppercase rounded-xl transition-all shadow-sm">Clear All Filters</button>
            </div>
        </div>

        <!-- CALENDAR FILTERS -->
        <div id="calendarFilters" class="hidden bg-white rounded-[32px] border border-slate-200 p-8 mb-8 shadow-sm">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Teacher</label>
                    <select id="calendarTeacherFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-sm font-bold outline-none cursor-pointer"></select>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Subject</label>
                    <select id="calendarSubjectFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-sm font-bold outline-none cursor-pointer"></select>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Choose Week</label>
                    <input type="week" id="weekPicker" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-sm font-bold outline-none">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Type</label>
                    <select id="calendarTypeFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-sm font-bold outline-none cursor-pointer">
                        <option value="ALL">All Special</option>
                        <option value="Trial">Trial</option>
                        <option value="Replacement">Replacement</option>
                        <option value="Assessment">Assessment</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">View</label>
                    <div class="flex bg-slate-100 p-1 rounded-xl h-14">
                        <button onclick="window.setStatus('all')" id="btnCalAll" class="flex-1 text-[10px] font-black uppercase rounded-lg status-btn-active">All</button>
                        <button onclick="window.setStatus('open')" id="btnCalOpen" class="flex-1 text-[10px] font-black uppercase rounded-lg text-slate-400">Free</button>
                        <button onclick="window.setStatus('booked')" id="btnCalBooked" class="flex-1 text-[10px] font-black uppercase rounded-lg text-slate-400">Full</button>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-end mt-4">
                <button onclick="window.clearFilters()" class="px-8 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 text-[10px] font-black uppercase rounded-xl transition-all shadow-sm">Clear All Filters</button>
            </div>
        </div>

        <!-- DISPLAY CONTAINERS -->
        <div id="listView" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        <div id="calendarView" class="hidden">
            <div class="bg-white rounded-[40px] border border-slate-200 shadow-xl overflow-hidden overflow-x-auto">
                <div class="min-w-[1000px]" id="calendarContainer"></div>
            </div>
        </div>
    </main>

    <!-- BOOKING MODAL -->
    <div id="bookingModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="window.closeModal()"></div>
        <div class="bg-white rounded-[40px] p-10 w-full max-w-sm relative z-10 shadow-2xl modal-animate">
            <h2 class="text-2xl font-black uppercase tracking-tighter mb-1">New Booking</h2>
            <p id="modalInfo" class="text-[10px] font-bold text-slate-400 uppercase mb-8"></p>
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[9px] font-black uppercase text-slate-400 ml-1">Student Name</label>
                    <input type="text" id="stuName" placeholder="Full Name" class="w-full bg-slate-100 p-5 rounded-2xl font-bold outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black uppercase text-slate-400 ml-1">Booking Date</label>
                    <input type="date" id="stuDate" class="w-full bg-slate-100 p-5 rounded-2xl font-bold outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black uppercase text-slate-400 ml-1">Booking Type</label>
                    <select id="stuType" class="w-full bg-slate-100 p-5 rounded-2xl font-bold outline-none cursor-pointer">
                        <option value="Trial">Trial</option>
                        <option value="Replacement">Replacement</option>
                        <option value="Assessment">Assessment</option>
                    </select>
                </div>
                <button onclick="window.saveBooking()" class="w-full py-5 mt-4 bg-indigo-600 text-white font-black uppercase rounded-2xl text-xs tracking-widest shadow-lg shadow-indigo-100 transition hover:bg-indigo-700">Confirm Booking</button>
            </div>
        </div>
    </div>

    <!-- CANCEL MODAL -->
    <div id="cancelModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onclick="window.closeCancelModal()"></div>
        <div class="bg-white rounded-[40px] p-10 w-full max-w-sm relative z-10 shadow-2xl modal-animate border border-slate-100">
            <h2 class="text-2xl font-black uppercase tracking-tighter mb-2 text-center">Cancel Class?</h2>
            <p id="cancelInfo" class="text-[11px] font-bold text-slate-400 uppercase mb-8 text-center leading-relaxed"></p>
            <div class="space-y-3">
                <button onclick="window.confirmCancel()" class="w-full py-5 bg-red-500 text-white font-black uppercase rounded-2xl text-[11px] tracking-widest transition hover:bg-red-600">Confirm Cancel</button>
                <button onclick="window.closeCancelModal()" class="w-full py-5 bg-slate-100 text-slate-600 font-black uppercase rounded-2xl text-[11px] tracking-widest transition hover:bg-slate-200">Go Back</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyATmsswJCUH2kzgyqhtgSHfwAfJLWhMBK0",
            authDomain: "class-one-students-enquiry.firebaseapp.com",
            databaseURL: "https://class-one-students-enquiry-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "class-one-students-enquiry",
            appId: "1:808629452867:web:fc65ad3a56b08b258fd4f6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);
        const auth = getAuth(app);
        const appId = 'timetable-manager-pro-v3';

        let master = [], cloudBookings = [], currentView = 'list', statusFilter = 'all';
        let pendingCancelId = null;

        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const DAY_MAP = {
            'Mon': 'Monday', 'Tue': 'Tuesday', 'Wed': 'Wednesday', 'Thu': 'Thursday', 'Fri': 'Friday', 'Sat': 'Saturday', 'Sun': 'Sunday',
            'Monday': 'Monday', 'Tuesday': 'Tuesday', 'Wednesday': 'Wednesday', 'Thursday': 'Thursday', 'Friday': 'Friday', 'Saturday': 'Saturday', 'Sunday': 'Sunday'
        };
        
        let TIMES = [];
        let SUBJECTS = []; // Dynamically extracted subjects

        // Helper to chronologically sort your real times
        const parseTimeStr = (t) => {
            if (!t) return 0;
            const clean = String(t).toLowerCase().replace(/\s/g, '');
            const isPM = clean.includes('pm');
            const parts = clean.replace(/[^\d:]/g, '').split(':');
            let h = parseInt(parts[0], 10) || 0;
            let m = parseInt(parts[1], 10) || 0;
            if (isPM && h !== 12) h += 12;
            if (!isPM && h === 12) h = 0;
            return h * 60 + m;
        };

        // DEEP DATA SCANNER
        const scanDatabase = (obj, path = []) => {
            let results = [];
            if (!obj || typeof obj !== 'object') return results;

            const keys = Object.keys(obj);
            const normalize = (str) => String(str).toLowerCase().replace(/[^a-z0-9]/g, '');
            
            const dayKey = keys.find(k => ['day', 'classday', 'days'].includes(normalize(k)));
            const timeKey = keys.find(k => ['time', 'classtime', 'starttime', 'slot'].includes(normalize(k)));

            if (dayKey && timeKey && typeof obj[dayKey] !== 'object' && typeof obj[timeKey] !== 'object') {
                let teacherName = '';

                const teacherKeys = ['teacher', 'name', 'tutor', 'instructor', 'sheet', 'sheetname', 'tab', 'tabname'];
                const explicitKey = keys.find(k => teacherKeys.includes(normalize(k)));
                
                if (explicitKey) {
                    teacherName = obj[explicitKey];
                } else {
                    for (let i = path.length - 1; i >= 0; i--) {
                        const p = String(path[i]);
                        if (/^\d+$/.test(p)) continue;
                        if (p.startsWith('-') && p.length > 15) continue;
                        if (['master', 'sheet1', 'sheet2', 'data', 'slots', 'records'].includes(normalize(p))) continue;
                        
                        teacherName = p; 
                        break;
                    }
                }

                if (!teacherName) teacherName = 'Unknown Teacher';

                const subjKey = keys.find(k => normalize(k).includes('subject'));
                const statusKey = keys.find(k => normalize(k).includes('status'));

                results.push({
                    teacher: String(teacherName).trim(),
                    day: String(obj[dayKey]).trim(),
                    time: String(obj[timeKey]).trim(),
                    subject: subjKey ? String(obj[subjKey]).trim() : 'General',
                    status: statusKey ? String(obj[statusKey]).trim() : ''
                });
            } else {
                for (let k of keys) {
                    if (obj[k] && typeof obj[k] === 'object') {
                        results = results.concat(scanDatabase(obj[k], [...path, k]));
                    }
                }
            }
            return results;
        };

        async function init() {
            const now = new Date();
            document.getElementById('weekPicker').value = `${now.getFullYear()}-W${String(getWeek(now)).padStart(2, '0')}`;
            populateTimeFilter();
            populateSubjectFilter();
            
            await signInAnonymously(auth);

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'bookings'), (snap) => {
                cloudBookings = snap.docs.map(d => ({ ...d.data(), id: d.id }));
                updateGlobalCounts();
                updateStatusIndicator("System Live", "bg-emerald-500");
                window.render();
            }, (err) => updateStatusIndicator("Sync Error", "bg-red-500"));

            onValue(ref(rtdb, 'master'), (snap) => {
                const val = snap.val();
                if(val) {
                    master = scanDatabase(val);
                    master = master.filter(i => i.day && i.time && i.day !== 'undefined');
                    
                    // Extract unique times
                    const rawTimes = [...new Set(master.map(m => m.time))].filter(Boolean);
                    TIMES = rawTimes.sort((a, b) => parseTimeStr(a) - parseTimeStr(b)); 
                    
                    // Extract unique subjects
                    const rawSubjects = [...new Set(master.map(m => m.subject))].filter(Boolean);
                    SUBJECTS = rawSubjects.sort();

                    populateTimeFilter(); 
                    populateSubjectFilter();
                    populateTeachers();
                    window.render();
                }
            });
        }

        function updateStatusIndicator(msg, colorClass) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (dot) dot.className = `w-2 h-2 rounded-full ${colorClass}`;
            if (text) text.innerText = msg;
        }

        function populateTeachers() {
            const teachers = [...new Set(master.map(m => m.teacher))].sort();
            const selects = [document.getElementById('teacherFilter'), document.getElementById('calendarTeacherFilter')];
            selects.forEach(sel => {
                if(!sel) return;
                const currentVal = sel.value;
                sel.innerHTML = '<option value="ALL">All Teachers</option>' + 
                    teachers.map(t => `<option value="${t}" ${t === currentVal ? 'selected' : ''}>${t}</option>`).join('');
            });
        }

        function populateTimeFilter() {
            const sel = document.getElementById('timeFilter');
            if(!sel) return;
            const currentVal = sel.value;
            sel.innerHTML = '<option value="ALL">All Times</option>' + TIMES.map(t => `<option value="${t}" ${t === currentVal ? 'selected' : ''}>${t}</option>`).join('');
        }

        function populateSubjectFilter() {
            const selects = [document.getElementById('subjectFilter'), document.getElementById('calendarSubjectFilter')];
            selects.forEach(sel => {
                if(!sel) return;
                const currentVal = sel.value;
                sel.innerHTML = '<option value="ALL">All Subjects</option>' + 
                    SUBJECTS.map(s => `<option value="${s}" ${s === currentVal ? 'selected' : ''}>${s}</option>`).join('');
            });
        }

        function getWeek(date) {
            const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        }

        function getWeekDates() {
            const weekStr = document.getElementById('weekPicker').value;
            if(!weekStr) return [];
            const [year, week] = weekStr.split('-W').map(Number);
            const d = new Date(year, 0, 1 + (week - 1) * 7);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff));
            return DAYS.map((_, i) => {
                const date = new Date(monday);
                date.setDate(monday.getDate() + i);
                return date;
            });
        }

        function getNextDayDate(dayName) {
            const dayIndex = DAYS.indexOf(dayName);
            const now = new Date();
            const currentDay = (now.getDay() + 6) % 7;
            const diff = (dayIndex - currentDay + 7) % 7;
            const targetDate = new Date(now);
            targetDate.setDate(now.getDate() + diff);
            return targetDate.toISOString().split('T')[0];
        }

        function updateGlobalCounts() {
            const getC = (type) => cloudBookings.filter(b => b.type === type).length;
            if(document.getElementById('countTrial')) document.getElementById('countTrial').innerText = getC('Trial');
            if(document.getElementById('countReplacement')) document.getElementById('countReplacement').innerText = getC('Replacement');
            if(document.getElementById('countAssessment')) document.getElementById('countAssessment').innerText = getC('Assessment');
        }

        function showToastPopup(msg, color) {
            const t = document.getElementById('toast');
            if(!t) return;
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastDot').className = `w-2 h-2 rounded-full ${color}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        window.render = () => {
            const weekDates = getWeekDates();
            const teacher = (currentView === 'list' ? document.getElementById('teacherFilter')?.value : document.getElementById('calendarTeacherFilter')?.value) || 'ALL';
            const subjectSel = (currentView === 'list' ? document.getElementById('subjectFilter')?.value : document.getElementById('calendarSubjectFilter')?.value) || 'ALL';
            const timeSel = (currentView === 'list' ? document.getElementById('timeFilter')?.value : 'ALL');
            const typeSelect = (currentView === 'list' ? document.getElementById('typeFilter')?.value : document.getElementById('calendarTypeFilter')?.value) || 'ALL';
            const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const dFilter = document.getElementById('dateFilter')?.value || '';
            const dayFilter = document.getElementById('dayFilter')?.value || 'ALL';

            if (currentView === 'list') {
                const list = document.getElementById('listView');
                if(!list) return;
                let combinedResults = [];

                master.forEach(slot => {
                    const slotDate = dFilter || getNextDayDate(slot.day);
                    const booking = findBooking(slot.teacher, slot.time, slotDate);
                    
                    let matches = true;
                    if (teacher !== 'ALL' && slot.teacher !== teacher) matches = false;
                    if (subjectSel !== 'ALL' && slot.subject !== subjectSel) matches = false;
                    if (timeSel !== 'ALL' && cleanTime(slot.time) !== cleanTime(timeSel)) matches = false;
                    if (dayFilter !== 'ALL' && slot.day !== dayFilter) matches = false;
                    
                    if (matches) {
                        const searchMatch = !search || 
                                          slot.teacher.toLowerCase().includes(search) || 
                                          (booking && booking.student.toLowerCase().includes(search));
                        const typeMatch = typeSelect === 'ALL' || (booking && booking.type === typeSelect);

                        if (searchMatch && typeMatch) {
                            const isSheetBooked = slot.status && String(slot.status).toLowerCase() === 'booked';
                            const isEffectivelyBooked = booking || isSheetBooked;

                            if (statusFilter === 'all' || (statusFilter === 'open' && !isEffectivelyBooked) || (statusFilter === 'booked' && isEffectivelyBooked)) {
                                combinedResults.push({ item: slot, b: booking, date: slotDate });
                            }
                        }
                    }
                });

                cloudBookings.forEach(b => {
                    if (combinedResults.some(res => res.b && res.b.id === b.id)) return;
                    let matches = true;
                    
                    const mItem = master.find(m => m.teacher === b.teacher);
                    const bSubject = mItem ? mItem.subject : '';

                    if (teacher !== 'ALL' && b.teacher !== teacher) matches = false;
                    if (subjectSel !== 'ALL' && bSubject !== subjectSel) matches = false;
                    if (timeSel !== 'ALL' && cleanTime(b.time) !== cleanTime(timeSel)) matches = false;
                    if (dayFilter !== 'ALL' && b.day !== dayFilter) matches = false;
                    if (dFilter && b.date !== dFilter) matches = false;
                    if (typeSelect !== 'ALL' && b.type !== typeSelect) matches = false;
                    if (statusFilter === 'open') matches = false;
                    if (search && !b.student.toLowerCase().includes(search) && !b.teacher.toLowerCase().includes(search)) matches = false;
                    
                    if (matches) combinedResults.push({ item: null, b: b, date: b.date });
                });

                combinedResults.sort((a,b) => {
                    const d1 = DAYS.indexOf(a.item ? a.item.day : a.b.day);
                    const d2 = DAYS.indexOf(b.item ? b.item.day : b.b.day);
                    if (d1 !== d2) return d1 - d2;
                    return parseTimeStr(a.item ? a.item.time : a.b.time) - parseTimeStr(b.item ? b.item.time : b.b.time);
                });

                list.innerHTML = combinedResults.map(res => renderCard(res.item, res.b, res.date)).join('') || 
                    `<div class="col-span-full py-20 text-center"><p class="text-slate-400 font-black uppercase text-xs">No slots found matching your filters</p></div>`;
            } else {
                renderWeeklyView(weekDates, teacher, subjectSel, typeSelect);
            }
        };

        function renderCard(item, b, slotDate) {
            const teacher = b ? b.teacher : item.teacher;
            const day = b ? b.day : item.day;
            const time = b ? b.time : item.time;
            const displayDate = b ? b.date : slotDate;
            const subject = b ? (master.find(m => m.teacher === b.teacher)?.subject || 'Special Class') : item.subject;

            const isSheetBooked = !b && item && item.status && String(item.status).toLowerCase() === 'booked';
            const isBooked = b || isSheetBooked;

            return `
            <div class="card p-6 rounded-[32px] bg-white ${isBooked ? 'card-booked' : 'shadow-sm'}">
                <div class="flex justify-between items-start mb-4">
                    <div class="max-w-[70%]">
                        <p class="text-[10px] font-black uppercase text-indigo-600 truncate">${teacher}</p>
                        <p class="text-[8px] font-bold text-slate-400 uppercase truncate">${subject}</p>
                    </div>
                    <span class="text-[7px] font-black uppercase px-2 py-1 rounded-lg ${isBooked ? 'bg-indigo-600 text-white' : 'bg-emerald-50 text-emerald-600'}">${isBooked ? 'Booked' : 'Available'}</span>
                </div>
                <p class="text-sm font-black text-slate-700 uppercase">${day}</p>
                <div class="flex items-center gap-2 mb-4">
                     <p class="text-[9px] font-bold text-slate-400 uppercase">${displayDate} @ ${time}</p>
                </div>
                ${b ? `
                    <div class="p-4 rounded-2xl type-${b.type.toLowerCase()} mb-3">
                        <p class="text-[7px] font-black uppercase opacity-50">Student</p>
                        <p class="text-xs font-black uppercase truncate">${b.student}</p>
                        <p class="text-[9px] font-black mt-1 uppercase opacity-80">${b.type}</p>
                    </div>
                    <button onclick="window.triggerCancel('${b.id}', '${b.student}', '${b.date}', '${b.time}')" class="w-full py-2 text-red-500 rounded-xl text-[9px] font-black uppercase hover:bg-red-50 transition-colors">Cancel Booking</button>
                ` : isSheetBooked ? `
                    <div class="p-4 rounded-2xl bg-slate-100 mb-3 border border-slate-200">
                        <p class="text-[7px] font-black uppercase opacity-50">Status</p>
                        <p class="text-xs font-black uppercase truncate text-slate-400">Reserved in Sheet</p>
                    </div>
                    <button disabled class="w-full py-2 text-slate-400 rounded-xl text-[9px] font-black uppercase bg-slate-50 cursor-not-allowed">Unavailable</button>
                ` : `
                    <button onclick="window.openBookingModal('${teacher}','${day}','${time}','${slotDate}')" class="w-full py-4 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-black transition-all">Book Now</button>
                `}
            </div>`;
        }

        function renderWeeklyView(weekDates, tFilter, subjectFilter, typeFilter) {
            const container = document.getElementById('calendarContainer');
            if(!container) return;

            let html = `<div class="grid grid-cols-[100px_repeat(7,1fr)] bg-slate-50 border-b border-slate-100">
                <div class="p-6"></div>
                ${DAYS.map((d,i) => `
                    <div class="p-6 text-center border-l border-slate-100">
                        <p class="font-black uppercase text-[10px] text-slate-400">${d.slice(0,3)}</p>
                        <p class="text-xs font-black">${weekDates[i].toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</p>
                    </div>`).join('')}
            </div>`;
            
            TIMES.forEach(time => {
                html += `<div class="grid grid-cols-[100px_repeat(7,1fr)] border-b border-slate-50">
                    <div class="p-4 text-[9px] font-black text-slate-300 flex items-center justify-center border-r border-slate-100">${time}</div>
                    ${DAYS.map(day => {
                        const dateStr = getDateString(day, weekDates);
                        
                        const dayBookings = cloudBookings.filter(b => {
                            if (b.date !== dateStr || cleanTime(b.time) !== cleanTime(time)) return false;
                            if (tFilter !== 'ALL' && b.teacher !== tFilter) return false;
                            if (subjectFilter !== 'ALL') {
                                const mItem = master.find(m => m.teacher === b.teacher);
                                if (!mItem || mItem.subject !== subjectFilter) return false;
                            }
                            return true;
                        });

                        const masterSlots = master.filter(s => {
                            if ((DAY_MAP[s.day] || s.day) !== day || cleanTime(s.time) !== cleanTime(time)) return false;
                            if (tFilter !== 'ALL' && s.teacher !== tFilter) return false;
                            if (subjectFilter !== 'ALL' && s.subject !== subjectFilter) return false;
                            return true;
                        });

                        const displayItems = [];
                        dayBookings.forEach(b => {
                            if (typeFilter === 'ALL' || b.type === typeFilter) {
                                if (statusFilter !== 'open') displayItems.push({ isBooked: true, data: b });
                            }
                        });
                        
                        if (statusFilter !== 'booked' && typeFilter === 'ALL') {
                            masterSlots.forEach(s => {
                                if (!dayBookings.some(b => b.teacher === s.teacher)) {
                                    const isSheetBooked = s.status && String(s.status).toLowerCase() === 'booked';
                                    if (statusFilter === 'open' && isSheetBooked) return;
                                    if (statusFilter === 'booked' && !isSheetBooked) return;
                                    displayItems.push({ isBooked: isSheetBooked, data: s, isSheetOnly: isSheetBooked });
                                }
                            });
                        }

                        return `<div class="p-1 min-h-[80px] border-l border-slate-50 flex flex-col gap-1.5">
                            ${displayItems.map(item => {
                                const b = item.isBooked && !item.isSheetOnly ? item.data : null;
                                const s = item.data;
                                
                                if (item.isSheetOnly) {
                                    return `<div class="text-[8px] p-2 rounded-xl font-black uppercase truncate shadow-sm bg-slate-200 text-slate-500 cursor-not-allowed">
                                        <span class="opacity-60 text-[7px] block">${s.teacher}</span>SHEET BOOKED
                                    </div>`;
                                } else if (b) {
                                    return `<div onclick="window.triggerCancel('${b.id}', '${b.student}', '${b.date}', '${b.time}')" 
                                         class="text-[8px] p-2 rounded-xl font-black uppercase truncate cursor-pointer shadow-sm type-${b.type.toLowerCase()}">
                                         <span class="opacity-60 text-[7px] block">${b.teacher}</span>${b.student}
                                    </div>`;
                                } else {
                                    return `<div onclick="window.openBookingModal('${s.teacher}','${day}','${s.time}','${dateStr}')" 
                                         class="text-[8px] p-2 rounded-xl font-black uppercase truncate cursor-pointer shadow-sm bg-slate-900 text-white">
                                         ${s.teacher}
                                    </div>`;
                                }
                            }).join('')}
                        </div>`;
                    }).join('')}
                </div>`;
            });
            container.innerHTML = html;
        }

        const cleanTime = (t) => t ? t.toLowerCase().replace(/\s/g,'').replace(/\./g,'').replace(/:/g,'') : '';
        const findBooking = (t, tm, d) => cloudBookings.find(b => b.teacher === t && cleanTime(b.time) === cleanTime(tm) && b.date === d);
        const getDateString = (day, dates) => { const i = DAYS.indexOf(day); return dates[i] ? dates[i].toISOString().split('T')[0] : null; };

        window.openBookingModal = (t, d, tm, dt) => {
            window.currentSlot = { teacher: t, day: d, time: tm };
            document.getElementById('modalInfo').innerText = `${t} | ${d} @ ${tm}`;
            
            const checkDate = document.getElementById('dateFilter')?.value;
            if(document.getElementById('stuDate')) document.getElementById('stuDate').value = dt || checkDate || '';
            if(document.getElementById('stuName')) document.getElementById('stuName').value = '';
            document.getElementById('bookingModal')?.classList.remove('hidden');
        };

        window.saveBooking = async () => {
            const name = document.getElementById('stuName')?.value.trim();
            const date = document.getElementById('stuDate')?.value;
            const type = document.getElementById('stuType')?.value || 'Trial';
            if(!name || !date) return;
            const id = `${window.currentSlot.teacher}_${date}_${cleanTime(window.currentSlot.time)}`.replace(/[^a-zA-Z0-9]/g, '');
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', id), { ...window.currentSlot, student: name, date, type, id });
            showToastPopup("Class Booked Successfully", "bg-emerald-400");
            window.closeModal();
        };

        window.triggerCancel = (id, student, date, time) => {
            pendingCancelId = id;
            document.getElementById('cancelInfo').innerHTML = `Student: ${student}<br>Date: ${date}<br>Time: ${time}`;
            document.getElementById('cancelModal')?.classList.remove('hidden');
        };

        window.confirmCancel = async () => {
            if(!pendingCancelId) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', pendingCancelId));
            showToastPopup("Booking Removed", "bg-red-400");
            window.closeCancelModal();
        };

        window.closeCancelModal = () => document.getElementById('cancelModal')?.classList.add('hidden');
        window.closeModal = () => document.getElementById('bookingModal')?.classList.add('hidden');

        window.setView = (v) => {
            currentView = v;
            document.getElementById('listView')?.classList.toggle('hidden', v !== 'list');
            document.getElementById('listFilters')?.classList.toggle('hidden', v !== 'list');
            document.getElementById('listStatusRow')?.classList.toggle('hidden', v !== 'list');
            document.getElementById('calendarView')?.classList.toggle('hidden', v !== 'calendar');
            document.getElementById('calendarFilters')?.classList.toggle('hidden', v !== 'calendar');
            if(document.getElementById('viewListBtn')) document.getElementById('viewListBtn').className = `flex-1 py-2.5 text-xs font-black uppercase transition-all ${v === 'list' ? 'toggle-active' : 'text-slate-400'}`;
            if(document.getElementById('viewCalendarBtn')) document.getElementById('viewCalendarBtn').className = `flex-1 py-2.5 text-xs font-black uppercase transition-all ${v === 'calendar' ? 'toggle-active' : 'text-slate-400'}`;
            window.render();
        };

        window.setStatus = (v) => {
            statusFilter = v;
            const keys = ['All', 'Open', 'Booked'];
            keys.forEach(k => {
                const b1 = document.getElementById('btn' + k);
                const b2 = document.getElementById('btnCal' + k);
                const isActive = k.toLowerCase() === v;
                if(b1) b1.className = isActive ? "flex-1 text-[9px] font-black uppercase rounded-lg status-btn-active" : "flex-1 text-[9px] font-black uppercase rounded-lg text-slate-400 hover:bg-slate-200 transition";
                if(b2) b2.className = isActive ? "flex-1 text-[10px] font-black uppercase rounded-lg status-btn-active" : "flex-1 text-[10px] font-black uppercase rounded-lg text-slate-400 hover:bg-slate-200 transition";
            });
            window.render();
        };

        window.clearFilters = () => {
            if(document.getElementById('searchInput')) document.getElementById('searchInput').value = '';
            if(document.getElementById('teacherFilter')) document.getElementById('teacherFilter').value = 'ALL';
            if(document.getElementById('subjectFilter')) document.getElementById('subjectFilter').value = 'ALL';
            if(document.getElementById('timeFilter')) document.getElementById('timeFilter').value = 'ALL';
            if(document.getElementById('dayFilter')) document.getElementById('dayFilter').value = 'ALL';
            if(document.getElementById('dateFilter')) document.getElementById('dateFilter').value = '';
            if(document.getElementById('typeFilter')) document.getElementById('typeFilter').value = 'ALL';
            
            if(document.getElementById('calendarTeacherFilter')) document.getElementById('calendarTeacherFilter').value = 'ALL';
            if(document.getElementById('calendarSubjectFilter')) document.getElementById('calendarSubjectFilter').value = 'ALL';
            if(document.getElementById('calendarTypeFilter')) document.getElementById('calendarTypeFilter').value = 'ALL';
            
            window.setStatus('all');
            window.render();
            showToastPopup("Filters Cleared", "bg-slate-500");
        };

        init();
    </script>
</body>
</html>
