<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C1 Booking Manager | Smart Slots</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid #f1f5f9; }
        .card:hover { transform: translateY(-2px); border-color: #e2e8f0; }
        .card-booked { border-color: #4f46e5 !important; background-color: #ffffff; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.1); }
        .toggle-active { background-color: white !important; color: #4f46e5 !important; font-weight: 900 !important; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .status-btn-active { background-color: #1e293b !important; color: white !important; }
        
        .type-trial { background-color: #fef9c3; color: #854d0e; border: 1px solid #facc15; }
        .type-replacement { background-color: #ffedd5; color: #9a3412; border: 1px solid #fb923c; }
        .type-assessment { background-color: #f3e8ff; color: #581c87; border: 1px solid #c084fc; }
        .type-standard { background-color: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

        .filter-tag { cursor: pointer; transition: all 0.2s; border: 1px solid #e2e8f0; white-space: nowrap; }
        .filter-tag:hover { border-color: #cbd5e1; background-color: #f1f5f9; }
        .filter-tag.active { background-color: #4f46e5; color: white; border-color: #4f46e5; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2); }

        #toast { transition: all 0.4s ease; transform: translateY(100px); opacity: 0; pointer-events: none; }
        #toast.show { transform: translateY(0); opacity: 1; }
        .modal-animate { animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- COUNTER HUD -->
    <div class="fixed bottom-6 left-6 z-[100] flex flex-col gap-2 bg-slate-900 text-white p-4 rounded-[28px] shadow-2xl border border-slate-700/50 min-w-[180px]">
        <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-1">
            <span class="text-[9px] font-black uppercase text-indigo-400">Activity Summary</span>
        </div>
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold text-slate-400">TRIALS</span>
            <span id="countTrial" class="text-xs font-black text-yellow-400">0</span>
        </div>
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold text-slate-400">REPLACEMENTS</span>
            <span id="countReplacement" class="text-xs font-black text-orange-400">0</span>
        </div>
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold text-slate-400">ASSESSMENTS</span>
            <span id="countAssessment" class="text-xs font-black text-purple-400">0</span>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] bg-slate-900 text-white px-8 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-2xl flex items-center gap-3">
        <span id="toastDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="toastMsg">Action Successful</span>
    </div>

    <!-- HEADER NAV -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 h-20 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-black italic text-xl shadow-lg shadow-indigo-200">C1</div>
            <div>
                <h1 class="text-[10px] font-black uppercase text-slate-400 leading-none mb-1">Teacher Availability</h1>
                <div class="flex items-center gap-2">
                    <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-300"></span>
                    <span id="statusText" class="text-xs font-bold text-slate-600 uppercase">Connecting...</span>
                </div>
            </div>
        </div>
        <div class="flex bg-slate-100 p-1.5 rounded-2xl w-80">
            <button onclick="window.setView('list')" id="viewListBtn" class="flex-1 py-2.5 text-xs font-black uppercase transition-all toggle-active">Slots Search</button>
            <button onclick="window.setView('calendar')" id="viewCalendarBtn" class="flex-1 py-2.5 text-xs font-black uppercase transition-all text-slate-400">Weekly View</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        
        <!-- SEARCH FILTERS -->
        <div id="listFilters" class="bg-white rounded-[32px] border border-slate-200 p-8 mb-8 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-5 gap-6 mb-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Search Name</label>
                    <input type="text" id="searchInput" oninput="window.render()" placeholder="Teacher/Student..." class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold outline-none ring-indigo-500 focus:ring-2">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Teacher</label>
                    <select id="teacherFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold outline-none cursor-pointer">
                        <option value="ALL">All Teachers</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Check Date</label>
                    <input type="date" id="dateFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold outline-none">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Special Type</label>
                    <select id="typeFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold outline-none cursor-pointer">
                        <option value="ALL">All Special</option>
                        <option value="Trial Session">Trial</option>
                        <option value="Replacement">Replacement</option>
                        <option value="Assessment">Assessment</option>
                    </select>
                </div>
                <div class="space-y-2 flex flex-col justify-end">
                    <button onclick="window.clearFilters()" class="w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 text-[10px] font-black uppercase rounded-2xl transition-all">Clear All Filters</button>
                </div>
            </div>

            <!-- Multi-Select Row for Subjects -->
            <div class="space-y-2 mb-6">
                <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Filter by Subject</label>
                <div id="subjectSelector" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- Multi-Select Row for Days -->
            <div class="space-y-2 mb-6">
                <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Filter by Days</label>
                <div id="daySelector" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- Multi-Select Row for Times -->
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Filter by Times</label>
                <div id="timeSelector" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto p-1"></div>
            </div>
        </div>

        <!-- CALENDAR FILTERS -->
        <div id="calendarFilters" class="hidden bg-white rounded-[32px] border border-slate-200 p-8 mb-8 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Teacher</label>
                    <select id="calendarTeacherFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-sm font-bold outline-none cursor-pointer">
                        <option value="ALL">All Teachers</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Choose Week</label>
                    <input type="week" id="weekPicker" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-sm font-bold outline-none">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Type</label>
                    <select id="calendarTypeFilter" onchange="window.render()" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 text-sm font-bold outline-none cursor-pointer">
                        <option value="ALL">All Special</option>
                        <option value="Trial Session">Trial</option>
                        <option value="Replacement">Replacement</option>
                        <option value="Assessment">Assessment</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Status</label>
                    <div class="flex bg-slate-100 p-1 rounded-xl">
                        <button onclick="window.setStatus('all')" id="btnCalAll" class="flex-1 py-2 text-[10px] font-black uppercase rounded-lg status-btn-active">All</button>
                        <button onclick="window.setStatus('open')" id="btnCalOpen" class="flex-1 py-2 text-[10px] font-black uppercase rounded-lg text-slate-400">Free</button>
                        <button onclick="window.setStatus('booked')" id="btnCalBooked" class="flex-1 py-2 text-[10px] font-black uppercase rounded-lg text-slate-400">Full</button>
                    </div>
                </div>
                <div class="space-y-2 flex flex-col justify-end">
                    <button onclick="window.clearFilters()" class="w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 text-[10px] font-black uppercase rounded-2xl transition-all">Clear All</button>
                </div>
            </div>
        </div>

        <!-- LIST STATUS TOGGLE -->
        <div id="listStatusRow" class="mb-6 flex justify-end">
            <div class="flex bg-white border border-slate-200 p-1.5 rounded-[20px] w-64 shadow-sm">
                <button onclick="window.setStatus('all')" id="btnAll" class="flex-1 py-2 text-[9px] font-black uppercase rounded-xl status-btn-active">All Slots</button>
                <button onclick="window.setStatus('open')" id="btnOpen" class="flex-1 py-2 text-[9px] font-black uppercase rounded-xl text-slate-400">Free Only</button>
                <button onclick="window.setStatus('booked')" id="btnBooked" class="flex-1 py-2 text-[9px] font-black uppercase rounded-xl text-slate-400">Booked</button>
            </div>
        </div>

        <!-- DISPLAY CONTAINERS -->
        <div id="listView" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        <div id="calendarView" class="hidden">
            <div class="bg-white rounded-[40px] border border-slate-200 shadow-xl overflow-hidden overflow-x-auto">
                <div class="min-w-[1000px]" id="calendarContainer"></div>
            </div>
        </div>
    </main>

    <!-- BOOKING MODAL -->
    <div id="bookingModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="window.closeModal()"></div>
        <div class="bg-white rounded-[40px] p-10 w-full max-w-sm relative z-10 shadow-2xl modal-animate">
            <h2 class="text-2xl font-black uppercase tracking-tighter mb-1">New Booking</h2>
            <p id="modalInfo" class="text-[10px] font-bold text-slate-400 uppercase mb-8"></p>
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[9px] font-black uppercase text-slate-400 ml-1">Student Name</label>
                    <input type="text" id="stuName" placeholder="Full Name" class="w-full bg-slate-100 p-5 rounded-2xl font-bold outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black uppercase text-slate-400 ml-1">Booking Date</label>
                    <input type="date" id="stuDate" class="w-full bg-slate-100 p-5 rounded-2xl font-bold outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black uppercase text-slate-400 ml-1">Booking Type</label>
                    <select id="stuType" class="w-full bg-slate-100 p-5 rounded-2xl font-bold outline-none cursor-pointer">
                        <option value="Trial Session">Trial Session</option>
                        <option value="Replacement">Replacement</option>
                        <option value="Assessment">Assessment</option>
                    </select>
                </div>
                <button onclick="window.saveBooking()" class="w-full py-5 mt-4 bg-indigo-600 text-white font-black uppercase rounded-2xl text-xs tracking-widest shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-colors">Confirm Booking</button>
            </div>
        </div>
    </div>

    <!-- CANCEL MODAL -->
    <div id="cancelModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onclick="window.closeCancelModal()"></div>
        <div class="bg-white rounded-[40px] p-10 w-full max-w-sm relative z-10 shadow-2xl modal-animate border border-slate-100">
            <h2 class="text-2xl font-black uppercase tracking-tighter mb-2 text-center text-slate-900">Cancel Class?</h2>
            <p id="cancelInfo" class="text-[11px] font-bold text-slate-400 uppercase mb-8 text-center leading-relaxed"></p>
            <div class="space-y-3">
                <button onclick="window.confirmCancel()" class="w-full py-5 bg-red-500 hover:bg-red-600 transition-colors text-white font-black uppercase rounded-2xl text-[11px] tracking-widest">Confirm Cancel</button>
                <button onclick="window.closeCancelModal()" class="w-full py-5 bg-slate-100 hover:bg-slate-200 transition-colors text-slate-600 font-black uppercase rounded-2xl text-[11px] tracking-widest">Go Back</button>
            </div>
        </div>
    </div>

    <!-- ================= BULLETPROOF FIREBASE LOGIC ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyATmsswJCUH2kzgyqhtgSHfwAfJLWhMBK0",
            authDomain: "class-one-students-enquiry.firebaseapp.com",
            databaseURL: "https://class-one-students-enquiry-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "class-one-students-enquiry",
            appId: "1:808629452867:web:fc65ad3a56b08b258fd4f6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);
        const auth = getAuth(app);
        const appId = 'timetable-manager-pro-v3';

        let master = [], cloudBookings = [], currentView = 'list', statusFilter = 'all';
        let selectedDays = [];
        let selectedTimes = [];
        let selectedSubjects = [];
        let pendingCancelId = null;

        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const DAY_MAP = {
            'Mon': 'Monday', 'Tue': 'Tuesday', 'Wed': 'Wednesday', 'Thu': 'Thursday', 'Fri': 'Friday', 'Sat': 'Saturday', 'Sun': 'Sunday',
            'Monday': 'Monday', 'Tuesday': 'Tuesday', 'Wednesday': 'Wednesday', 'Thursday': 'Thursday', 'Friday': 'Friday', 'Saturday': 'Saturday', 'Sunday': 'Sunday'
        };
        const SUBJECTS = ['BC', 'BM', 'EN', 'SOK'];

        const TIMES = [];
        for(let h=8; h<=21; h++){ 
            for(let m of ['00','30']){ 
                const am = h >= 12 ? 'pm' : 'am'; 
                const h12 = h % 12 || 12; 
                TIMES.push(`${h12}:${m}${am}`); 
            } 
        }

        async function init() {
            try {
                const now = new Date();
                const weekPicker = document.getElementById('weekPicker');
                if (weekPicker) {
                    weekPicker.value = `${now.getFullYear()}-W${String(getWeek(now)).padStart(2, '0')}`;
                }
                
                renderSubjectSelector();
                renderDaySelector();
                renderTimeSelector();
                
                await signInAnonymously(auth);

                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'bookings'), (snap) => {
                    cloudBookings = snap.docs.map(d => ({ ...d.data(), id: d.id }));
                    updateGlobalCounts();
                    updateStatusIndicator("System Live", "bg-emerald-500");
                    window.render();
                }, (err) => {
                    console.error("Firestore Sync Error:", err);
                    updateStatusIndicator("Sync Error", "bg-red-500");
                });

                onValue(ref(rtdb, 'master'), (snap) => {
                    const val = snap.val();
                    if(val) {
                        master = (Array.isArray(val) ? val : Object.values(val)).filter(i => i && i.teacher);
                        populateTeachers();
                        window.render();
                    }
                }, (err) => {
                    console.error("RTDB Sync Error:", err);
                });
            } catch (error) {
                console.error("Initialization Failed:", error);
                updateStatusIndicator("Load Error", "bg-red-500");
            }
        }

        function renderSubjectSelector() {
            const container = document.getElementById('subjectSelector');
            if(!container) return;
            container.innerHTML = SUBJECTS.map(sub => `
                <div onclick="window.toggleSubject('${sub}')" 
                     id="tag-sub-${sub}"
                     class="filter-tag px-5 py-2 rounded-xl text-[10px] font-black uppercase text-slate-500">
                    ${sub}
                </div>
            `).join('');
        }

        function renderDaySelector() {
            const container = document.getElementById('daySelector');
            if(!container) return;
            container.innerHTML = DAYS.map(day => `
                <div onclick="window.toggleDay('${day}')" 
                     id="tag-day-${day}"
                     class="filter-tag px-4 py-2 rounded-xl text-[10px] font-black uppercase text-slate-500">
                    ${day}
                </div>
            `).join('');
        }

        function renderTimeSelector() {
            const container = document.getElementById('timeSelector');
            if(!container) return;
            container.innerHTML = TIMES.map(time => `
                <div onclick="window.toggleTime('${time}')" 
                     id="tag-time-${time.replace(':','')}"
                     class="filter-tag px-3 py-1.5 rounded-xl text-[9px] font-black uppercase text-slate-500">
                    ${time}
                </div>
            `).join('');
        }

        window.toggleSubject = (sub) => {
            if (selectedSubjects.includes(sub)) {
                selectedSubjects = selectedSubjects.filter(s => s !== sub);
                document.getElementById(`tag-sub-${sub}`)?.classList.remove('active');
            } else {
                selectedSubjects.push(sub);
                document.getElementById(`tag-sub-${sub}`)?.classList.add('active');
            }
            window.render();
        };

        window.toggleDay = (day) => {
            if (selectedDays.includes(day)) {
                selectedDays = selectedDays.filter(d => d !== day);
                document.getElementById(`tag-day-${day}`)?.classList.remove('active');
            } else {
                selectedDays.push(day);
                document.getElementById(`tag-day-${day}`)?.classList.add('active');
            }
            window.render();
        };

        window.toggleTime = (time) => {
            if (selectedTimes.includes(time)) {
                selectedTimes = selectedTimes.filter(t => t !== time);
                document.getElementById(`tag-time-${time.replace(':','')}`)?.classList.remove('active');
            } else {
                selectedTimes.push(time);
                document.getElementById(`tag-time-${time.replace(':','')}`)?.classList.add('active');
            }
            window.render();
        };

        function updateStatusIndicator(msg, colorClass) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if(dot) {
                dot.className = `w-2 h-2 rounded-full ${colorClass}`;
                if(colorClass.includes("emerald")) dot.classList.add("shadow-[0_0_8px_rgba(16,185,129,0.8)]");
            }
            if(text) text.innerText = msg;
        }

        function populateTeachers() {
            const teachers = [...new Set(master.map(m => m.teacher))].sort();
            const selects = [document.getElementById('teacherFilter'), document.getElementById('calendarTeacherFilter')];
            selects.forEach(sel => {
                if(!sel) return;
                const currentVal = sel.value;
                sel.innerHTML = '<option value="ALL">All Teachers</option>' + 
                    teachers.map(t => `<option value="${t}" ${t === currentVal ? 'selected' : ''}>${t}</option>`).join('');
            });
        }

        function getWeek(date) {
            const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        }

        function getWeekDates() {
            const weekPicker = document.getElementById('weekPicker');
            const weekStr = weekPicker ? weekPicker.value : '';
            if(!weekStr) return [];
            const [year, week] = weekStr.split('-W').map(Number);
            const d = new Date(year, 0, 1 + (week - 1) * 7);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff));
            return DAYS.map((_, i) => {
                const date = new Date(monday);
                date.setDate(monday.getDate() + i);
                return date;
            });
        }

        function updateGlobalCounts() {
            const getC = (type) => cloudBookings.filter(b => (b.type || '').includes(type)).length;
            const t = document.getElementById('countTrial');
            const r = document.getElementById('countReplacement');
            const a = document.getElementById('countAssessment');
            if(t) t.innerText = getC('Trial');
            if(r) r.innerText = getC('Replacement');
            if(a) a.innerText = getC('Assessment');
        }

        function showToastPopup(msg, color) {
            const t = document.getElementById('toast');
            if(!t) return;
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastDot').className = `w-2 h-2 rounded-full ${color}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        window.render = () => {
            try {
                const weekDates = getWeekDates();
                const tFilter = (currentView === 'list' ? document.getElementById('teacherFilter')?.value : document.getElementById('calendarTeacherFilter')?.value) || 'ALL';
                const typeFilterVal = (currentView === 'list' ? document.getElementById('typeFilter')?.value : document.getElementById('calendarTypeFilter')?.value) || 'ALL';
                const searchVal = document.getElementById('searchInput')?.value.toLowerCase() || '';
                const checkDateVal = document.getElementById('dateFilter')?.value || '';

                if (currentView === 'list') {
                    const list = document.getElementById('listView');
                    if(!list) return;
                    let results = [];

                    master.forEach(slot => {
                        const fullDay = DAY_MAP[slot.day] || slot.day;
                        
                        if (selectedDays.length > 0 && !selectedDays.includes(fullDay)) return;
                        if (selectedTimes.length > 0 && !selectedTimes.some(t => cleanTime(t) === cleanTime(slot.time))) return;
                        if (tFilter !== 'ALL' && slot.teacher !== tFilter) return;

                        if (selectedSubjects.length > 0) {
                            const subj = String(slot.subject || '').toUpperCase();
                            if (!selectedSubjects.some(sub => subj.includes(sub))) return;
                        }

                        let booking = null;
                        if (checkDateVal) {
                            booking = cloudBookings.find(b => 
                                b.teacher === slot.teacher && 
                                cleanTime(b.time) === cleanTime(slot.time) && 
                                b.date === checkDateVal
                            );
                        }

                        // Robust sheet status checking
                        const sheetStatus = slot.status || slot.Status;
                        const isSheetBooked = Boolean(sheetStatus && String(sheetStatus).trim().toLowerCase() === 'booked');
                        const isEffectivelyBooked = Boolean(booking || isSheetBooked);

                        if (statusFilter === 'open' && isEffectivelyBooked) return;
                        if (statusFilter === 'booked' && !isEffectivelyBooked) return;

                        const matchesSearch = !searchVal || 
                            String(slot.teacher || '').toLowerCase().includes(searchVal) || 
                            (booking && (String(booking.student || '').toLowerCase().includes(searchVal) || String(booking.teacher || '').toLowerCase().includes(searchVal)));
                        
                        if (!matchesSearch) return;

                        if (typeFilterVal !== 'ALL' && (!booking || booking.type !== typeFilterVal)) return;

                        results.push({ item: slot, b: booking });
                    });

                    cloudBookings.forEach(b => {
                        const fullDay = DAY_MAP[b.day] || b.day;
                        if (results.some(r => r.b && r.b.id === b.id)) return;
                        
                        if (selectedDays.length > 0 && !selectedDays.includes(fullDay)) return;
                        if (selectedTimes.length > 0 && !selectedTimes.some(t => cleanTime(t) === cleanTime(b.time))) return;
                        if (tFilter !== 'ALL' && b.teacher !== tFilter) return;
                        if (checkDateVal && b.date !== checkDateVal) return;
                        if (typeFilterVal !== 'ALL' && b.type !== typeFilterVal) return;
                        if (statusFilter === 'open') return;

                        if (selectedSubjects.length > 0) {
                            const mItem = master.find(m => m.teacher === b.teacher);
                            const subj = String(mItem ? mItem.subject : '').toUpperCase();
                            if (!selectedSubjects.some(sub => subj.includes(sub))) return;
                        }

                        const matchesSearch = !searchVal || 
                            String(b.teacher || '').toLowerCase().includes(searchVal) || 
                            String(b.student || '').toLowerCase().includes(searchVal);
                        
                        if (!matchesSearch) return;

                        results.push({ item: null, b: b });
                    });

                    results.sort((a,b) => {
                        const d1 = DAYS.indexOf(DAY_MAP[a.item ? a.item.day : a.b.day]);
                        const d2 = DAYS.indexOf(DAY_MAP[b.item ? b.item.day : b.b.day]);
                        if (d1 !== d2) return d1 - d2;
                        return TIMES.indexOf(cleanTime(a.item ? a.item.time : a.b.time)) - TIMES.indexOf(cleanTime(b.item ? b.item.time : b.b.time));
                    });

                    list.innerHTML = results.map(res => renderCard(res.item, res.b)).join('') || 
                        `<div class="col-span-full py-20 text-center"><p class="text-slate-400 font-black uppercase text-xs bg-white py-4 px-6 rounded-2xl inline-block shadow-sm">No slots found matching your filters</p></div>`;
                } else {
                    renderWeeklyView(weekDates, tFilter, typeFilterVal);
                }
            } catch (err) {
                console.error("UI Render Blocked due to error:", err);
            }
        };

        function renderCard(item, b) {
            try {
                const teacher = b ? b.teacher : (item?.teacher || 'Unknown');
                const rawDay = b ? b.day : (item?.day || 'Unknown');
                const fullDay = DAY_MAP[rawDay] || rawDay;
                const time = b ? b.time : (item?.time || 'Unknown');
                const subject = b ? (master.find(m => m.teacher === b.teacher)?.subject || 'Special Session') : (item?.subject || 'N/A');
                
                const sheetStatus = item ? (item.status || item.Status) : null;
                const isSheetBooked = Boolean(!b && sheetStatus && String(sheetStatus).trim().toLowerCase() === 'booked');
                const isBooked = Boolean(b || isSheetBooked);
                
                // Maps "Trial Session" -> "trial" for css matching
                const safeTypeClass = b?.type ? String(b.type).split(' ')[0].toLowerCase() : 'standard';

                return `
                <div class="card p-6 rounded-[32px] bg-white ${isBooked ? 'card-booked' : 'shadow-sm'} flex flex-col h-full justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div class="max-w-[70%]">
                                <p class="text-[11px] font-black uppercase text-indigo-600 truncate tracking-wide">${teacher}</p>
                                <p class="text-[9px] font-bold text-slate-400 uppercase truncate">${subject}</p>
                            </div>
                            <span class="text-[8px] font-black uppercase px-2.5 py-1.5 rounded-xl ${isBooked ? 'bg-indigo-600 text-white' : 'bg-emerald-50 text-emerald-600 border border-emerald-100'}">${isBooked ? 'Booked' : 'Available'}</span>
                        </div>
                        <p class="text-base font-black text-slate-800 uppercase tracking-tight">${fullDay}</p>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-5 bg-slate-50 inline-block px-2 py-1 rounded-lg mt-1">${time}</p>
                    </div>
                    
                    <div class="mt-auto">
                        ${b ? `
                            <div class="p-4 rounded-[20px] type-${safeTypeClass} mb-3 shadow-sm">
                                <p class="text-[8px] font-black uppercase opacity-60 tracking-wider">Student Name</p>
                                <p class="text-sm font-black uppercase truncate mt-0.5">${b.student || 'Unknown'}</p>
                                <p class="text-[9px] font-black mt-2 uppercase opacity-80 border-t border-black/10 pt-2">${b.date} | ${b.type || 'Unknown'}</p>
                            </div>
                            <button onclick="window.triggerCancel('${b.id}', '${b.student || ''}', '${b.date}', '${b.time}')" class="w-full py-3.5 text-red-500 rounded-2xl text-[10px] font-black uppercase hover:bg-red-50 transition-colors tracking-widest border border-transparent hover:border-red-100">Cancel Booking</button>
                        ` : isSheetBooked ? `
                            <div class="p-4 rounded-[20px] bg-slate-100 mb-3 border border-slate-200">
                                <p class="text-[8px] font-black uppercase opacity-50 tracking-wider">Status</p>
                                <p class="text-xs font-black uppercase truncate text-slate-500 mt-1">Reserved in System</p>
                            </div>
                            <button disabled class="w-full py-3.5 text-slate-400 rounded-2xl text-[10px] font-black uppercase bg-slate-50 cursor-not-allowed tracking-widest border border-slate-200">Unavailable</button>
                        ` : `
                            <button onclick="window.openBookingModal('${teacher}','${fullDay}','${time}')" class="w-full py-4 bg-slate-900 text-white rounded-2xl text-[11px] font-black uppercase tracking-[0.2em] hover:bg-indigo-600 transition-colors shadow-lg shadow-slate-900/20">Book Now</button>
                        `}
                    </div>
                </div>`;
            } catch (err) {
                console.error("Card Render Error:", err);
                return `<div class="card p-6 bg-red-50 text-red-500 rounded-[32px] text-xs font-bold text-center border-red-200">Data Render Error</div>`;
            }
        }

        function renderWeeklyView(weekDates, tFilter, typeFilter) {
            const container = document.getElementById('calendarContainer');
            if(!container) return;

            try {
                let html = `<div class="grid grid-cols-[100px_repeat(7,1fr)] bg-slate-50 border-b border-slate-200">
                    <div class="p-6"></div>
                    ${DAYS.map((d,i) => `
                        <div class="p-6 text-center border-l border-slate-200 bg-white">
                            <p class="font-black uppercase text-[10px] text-indigo-500 tracking-wider">${d.slice(0,3)}</p>
                            <p class="text-sm font-black text-slate-800">${weekDates[i]?.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) || ''}</p>
                        </div>`).join('')}
                </div>`;
                
                TIMES.forEach(time => {
                    html += `<div class="grid grid-cols-[100px_repeat(7,1fr)] border-b border-slate-100 group hover:bg-slate-50 transition-colors">
                        <div class="p-4 text-[9px] font-black text-slate-400 flex items-center justify-center border-r border-slate-200 bg-slate-50 group-hover:bg-slate-100 transition-colors">${time}</div>
                        ${DAYS.map(day => {
                            const dateStr = getDateString(day, weekDates);
                            
                            const dayBookings = cloudBookings.filter(b => {
                                if (b.date !== dateStr) return false;
                                if (cleanTime(b.time) !== cleanTime(time)) return false;
                                if (tFilter !== 'ALL' && b.teacher !== tFilter) return false;
                                if (selectedSubjects.length > 0) {
                                    const mItem = master.find(m => m.teacher === b.teacher);
                                    const subj = String(mItem ? mItem.subject : '').toUpperCase();
                                    if (!selectedSubjects.some(sub => subj.includes(sub))) return false;
                                }
                                return true;
                            });

                            const masterSlots = master.filter(s => {
                                if ((DAY_MAP[s.day] || s.day) !== day) return false;
                                if (cleanTime(s.time) !== cleanTime(time)) return false;
                                if (tFilter !== 'ALL' && s.teacher !== tFilter) return false;
                                if (selectedSubjects.length > 0) {
                                    const subj = String(s.subject || '').toUpperCase();
                                    if (!selectedSubjects.some(sub => subj.includes(sub))) return false;
                                }
                                return true;
                            });

                            const displayItems = [];
                            dayBookings.forEach(b => {
                                if (typeFilter === 'ALL' || b.type === typeFilter) {
                                    if (statusFilter !== 'open') displayItems.push({ isBooked: true, data: b });
                                }
                            });
                            
                            if (statusFilter !== 'booked' && typeFilter === 'ALL') {
                                masterSlots.forEach(s => {
                                    if (!dayBookings.some(b => b.teacher === s.teacher)) {
                                        const sheetStatus = s.status || s.Status;
                                        const isSheetBooked = Boolean(sheetStatus && String(sheetStatus).trim().toLowerCase() === 'booked');
                                        
                                        if (statusFilter === 'open' && isSheetBooked) return;
                                        if (statusFilter === 'booked' && !isSheetBooked) return;
                                        
                                        displayItems.push({ isBooked: isSheetBooked, data: s, isSheetOnly: isSheetBooked });
                                    }
                                });
                            }

                            return `<div class="p-1.5 min-h-[90px] border-l border-slate-100 flex flex-col gap-1.5 bg-white">
                                ${displayItems.map(item => {
                                    const b = item.isBooked && !item.isSheetOnly ? item.data : null;
                                    const s = item.data;
                                    
                                    if (item.isSheetOnly) {
                                        return `<div class="text-[9px] p-2.5 rounded-xl font-black uppercase truncate border border-slate-200 bg-slate-100 text-slate-500 cursor-not-allowed">
                                            <span class="opacity-60 text-[7px] block mb-0.5 tracking-wider">${s?.teacher || ''}</span>RESERVED
                                        </div>`;
                                    } else if (b) {
                                        const safeTypeClass = b.type ? String(b.type).split(' ')[0].toLowerCase() : 'standard';
                                        return `<div onclick="window.triggerCancel('${b.id}', '${b.student || ''}', '${b.date}', '${b.time}')" 
                                             class="text-[9px] p-2.5 rounded-xl font-black uppercase truncate cursor-pointer shadow-sm type-${safeTypeClass} hover:opacity-80 transition-opacity border">
                                             <span class="opacity-60 text-[7px] block mb-0.5 tracking-wider">${b.teacher || ''}</span>${b.student || ''}
                                        </div>`;
                                    } else {
                                        return `<div onclick="window.openBookingModal('${s?.teacher || ''}','${day}','${s?.time || ''}')" 
                                             class="text-[9px] p-2.5 rounded-xl font-black uppercase truncate cursor-pointer shadow-sm bg-slate-800 text-white hover:bg-indigo-600 transition-colors">
                                             ${s?.teacher || ''}
                                        </div>`;
                                    }
                                }).join('')}
                            </div>`;
                        }).join('')}
                    </div>`;
                });
                container.innerHTML = html;
            } catch(err) {
                console.error("Weekly view error:", err);
                container.innerHTML = `<div class="p-10 text-center text-red-500 font-black text-sm uppercase">Failed to load calendar view.<br>Please check data source formatting.</div>`;
            }
        }

        const cleanTime = (t) => t ? String(t).toLowerCase().replace(/\s/g,'').replace(/\./g,'').replace(/:/g,'') : '';
        const getDateString = (day, dates) => { const i = DAYS.indexOf(day); return dates[i] ? dates[i].toISOString().split('T')[0] : null; };

        window.openBookingModal = (t, d, tm) => {
            window.currentSlot = { teacher: t, day: d, time: tm };
            document.getElementById('modalInfo').innerText = `${t} • ${d} • ${tm}`;
            
            const checkDate = document.getElementById('dateFilter')?.value;
            if(document.getElementById('stuDate')) document.getElementById('stuDate').value = checkDate || '';
            if(document.getElementById('stuName')) document.getElementById('stuName').value = '';
            
            const modal = document.getElementById('bookingModal');
            if(modal) {
                modal.classList.remove('hidden');
                setTimeout(() => document.getElementById('stuName')?.focus(), 100);
            }
        };

        window.saveBooking = async () => {
            const name = document.getElementById('stuName')?.value.trim();
            const date = document.getElementById('stuDate')?.value;
            const type = document.getElementById('stuType')?.value || 'Trial Session';
            
            if(!name || !date) {
                alert("Please fill in both Student Name and Date.");
                return;
            }
            
            const id = `${window.currentSlot.teacher}_${date}_${cleanTime(window.currentSlot.time)}`.replace(/[^a-zA-Z0-9]/g, '');
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', id), { ...window.currentSlot, student: name, date, type, id });
            
            showToastPopup("Class Booked Successfully!", "bg-emerald-400");
            window.closeModal();
        };

        window.triggerCancel = (id, student, date, time) => {
            pendingCancelId = id;
            document.getElementById('cancelInfo').innerHTML = `<span class="block text-slate-800 text-lg mb-1">${student}</span><span class="block text-[10px] opacity-70">${date} @ ${time}</span>`;
            document.getElementById('cancelModal')?.classList.remove('hidden');
        };

        window.confirmCancel = async () => {
            if(!pendingCancelId) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', pendingCancelId));
            showToastPopup("Booking Removed.", "bg-amber-400");
            window.closeCancelModal();
        };

        window.closeCancelModal = () => document.getElementById('cancelModal')?.classList.add('hidden');
        window.closeModal = () => document.getElementById('bookingModal')?.classList.add('hidden');

        window.clearFilters = () => {
            if(document.getElementById('searchInput')) document.getElementById('searchInput').value = '';
            if(document.getElementById('teacherFilter')) document.getElementById('teacherFilter').value = 'ALL';
            if(document.getElementById('calendarTeacherFilter')) document.getElementById('calendarTeacherFilter').value = 'ALL';
            if(document.getElementById('dateFilter')) document.getElementById('dateFilter').value = '';
            if(document.getElementById('typeFilter')) document.getElementById('typeFilter').value = 'ALL';
            if(document.getElementById('calendarTypeFilter')) document.getElementById('calendarTypeFilter').value = 'ALL';
            
            selectedDays = [];
            DAYS.forEach(day => document.getElementById(`tag-day-${day}`)?.classList.remove('active'));
            
            selectedTimes = [];
            TIMES.forEach(t => {
                const el = document.getElementById(`tag-time-${t.replace(':','')}`);
                if(el) el.classList.remove('active');
            });

            selectedSubjects = [];
            SUBJECTS.forEach(sub => {
                const el = document.getElementById(`tag-sub-${sub}`);
                if(el) el.classList.remove('active');
            });
            
            window.setStatus('all');
            window.render();
            showToastPopup("Filters Cleared", "bg-indigo-400");
        };

        window.setView = (v) => {
            currentView = v;
            
            const listGrid = document.getElementById('listView');
            const calView = document.getElementById('calendarView');
            const listFilters = document.getElementById('listFilters');
            const calFilters = document.getElementById('calendarFilters');
            const listStatus = document.getElementById('listStatusRow');

            if (listGrid) listGrid.classList.toggle('hidden', v !== 'list');
            if (listFilters) listFilters.classList.toggle('hidden', v !== 'list');
            if (listStatus) listStatus.classList.toggle('hidden', v !== 'list');
            
            if (calView) calView.classList.toggle('hidden', v !== 'calendar');
            if (calFilters) calFilters.classList.toggle('hidden', v !== 'calendar');
            
            const listBtn = document.getElementById('viewListBtn');
            const calBtn = document.getElementById('viewCalendarBtn');
            
            if(listBtn) listBtn.className = `flex-1 py-2.5 text-xs font-black uppercase transition-all rounded-xl ${v === 'list' ? 'toggle-active' : 'text-slate-400 hover:text-slate-600'}`;
            if(calBtn) calBtn.className = `flex-1 py-2.5 text-xs font-black uppercase transition-all rounded-xl ${v === 'calendar' ? 'toggle-active' : 'text-slate-400 hover:text-slate-600'}`;
            
            window.render();
        };

        window.setStatus = (v) => {
            statusFilter = v;
            const keys = ['All', 'Open', 'Booked'];
            keys.forEach(k => {
                const b1 = document.getElementById('btn' + k);
                const b2 = document.getElementById('btnCal' + k);
                const isActive = k.toLowerCase() === v;
                
                if(b1) b1.className = isActive ? "flex-1 py-2 text-[9px] font-black uppercase rounded-xl status-btn-active transition-colors shadow-sm" : "flex-1 py-2 text-[9px] font-black uppercase rounded-xl text-slate-400 hover:text-slate-600 transition-colors";
                if(b2) b2.className = isActive ? "flex-1 py-2 text-[10px] font-black uppercase rounded-lg status-btn-active transition-colors shadow-sm" : "flex-1 py-2 text-[10px] font-black uppercase rounded-lg text-slate-400 hover:text-slate-600 transition-colors";
            });
            window.render();
        };

        init();
    </script>
</body>
</html>
